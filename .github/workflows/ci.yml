name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

jobs:
  lite:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: voidzero-dev/setup-vp@v1
        with:
          working-directory: lite
      - run: vp test
        working-directory: lite

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: AnswerDotAI/workflows/sccache@master
        with:
          r2-url: ${{ secrets.SCCACHE_R2 }}
      - uses: AnswerDotAI/workflows/setup-uv@master
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: uv pip install --system --config-settings-package mdhtml:metadata-only=1 -e '.[test]'
      - run: cargo develop
      - run: pytest -q

  wasm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: AnswerDotAI/workflows/sccache@master
        with:
          r2-url: ${{ secrets.SCCACHE_R2 }}
      - uses: actions/setup-node@v7
        with:
          node-version: 'lts/*'
      - run: sudo apt-get update && sudo apt-get install -y binaryen
      - run: cargo wasm --profile wasm
      - run: node --test tests/wasm.mjs
      # The `npm` job publishes this package on a `v*` tag.
      - uses: actions/upload-artifact@v7
        with:
          name: wasm-pkg
          path: wasm/pkg

  build:
    if: startsWith(github.ref, 'refs/tags/v')
    strategy:
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: AnswerDotAI/workflows/sccache@master
        with:
          r2-url: ${{ secrets.SCCACHE_R2 }}
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - uses: AnswerDotAI/workflows/maturin-build@master
        with:
          args: --profile dist --out dist ${{ runner.os == 'Linux' && '--zig' || '' }}
          manylinux: '2_31'
      - uses: actions/upload-artifact@v7
        with:
          name: wheels-${{ matrix.os }}
          path: dist

  sdist:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: AnswerDotAI/workflows/maturin-build@master
        with:
          command: sdist
          args: -o dist
      - uses: actions/upload-artifact@v7
        with:
          name: wheels-sdist
          path: dist

  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [test, build, sdist]
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          pattern: wheels-*
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v3
        with:
          files: dist/*
          generate_release_notes: true
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/

  crate:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: test
    runs-on: ubuntu-latest
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: rust-lang/crates-io-auth-action@v1
        id: auth
      - run: cargo publish -p mdhtml-crate --no-verify
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}

  npm:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [test, wasm, lite]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        directory: [wasm/pkg, lite]
    # Both npm packages trust this workflow and share the Cargo release version.
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - if: matrix.directory == 'wasm/pkg'
        uses: actions/download-artifact@v8
        with:
          name: wasm-pkg
          path: wasm/pkg
      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
          registry-url: https://registry.npmjs.org
      - run: |
          npm pkg set version="${GITHUB_REF_NAME#v}"
          npm publish --access public --ignore-scripts
        working-directory: ${{ matrix.directory }}
